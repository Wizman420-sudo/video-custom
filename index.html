<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频定制 | KKV 系列</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            font-weight: 300;
        }

        .form-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        /* 预览区域 */
        .preview-box {
            background: #fafafa;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        .preview-title {
            font-size: 1rem;
            color: #666;
            margin-bottom: 25px;
        }

        .preview-container {
            position: relative;
            display: inline-block;
            max-width: 600px;
            width: 100%;
        }

        .preview-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        /* 指甲颜色叠加层 */
        .nail-overlay {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: multiply;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        /* 大脚趾 */
        .nail-overlay-1 {
            top: 28%;
            left: 68%;
            width: 8.5%;
            height: 11%;
            transform: rotate(-10deg);
        }

        /* 第二脚趾 */
        .nail-overlay-2 {
            top: 22%;
            left: 58%;
            width: 6.5%;
            height: 8.5%;
            transform: rotate(-5deg);
        }

        /* 第三脚趾 */
        .nail-overlay-3 {
            top: 20%;
            left: 49%;
            width: 5.5%;
            height: 7.5%;
            transform: rotate(0deg);
        }

        /* 第四脚趾 */
        .nail-overlay-4 {
            top: 22%;
            left: 41%;
            width: 5%;
            height: 7%;
            transform: rotate(5deg);
        }

        /* 小脚趾 */
        .nail-overlay-5 {
            top: 26%;
            left: 34%;
            width: 4.5%;
            height: 6.5%;
            transform: rotate(10deg);
        }

        /* 颜色选择网格 */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .color-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-card:hover {
            transform: scale(1.08);
        }

        .color-swatch {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            border: 3px solid transparent;
            transition: border-color 0.3s ease;
        }

        .color-swatch::after {
            content: '';
            position: absolute;
            top: 12%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .color-card.selected .color-swatch {
            border-color: #1a1a1a;
        }

        .color-name {
            font-size: 0.85rem;
            color: #333;
            text-align: center;
        }

        /* 普通选项网格 */
        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .option-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option-card:hover {
            border-color: #333;
            background: #fafafa;
        }

        .option-card.selected {
            border-color: #333;
            background: #333;
            color: #fff;
        }

        .option-card input[type="radio"],
        .option-card input[type="checkbox"] {
            display: none;
        }

        .option-label {
            font-size: 0.95rem;
            font-weight: 400;
        }

        .option-price {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        .option-card.selected .option-price {
            color: #ccc;
        }

        .text-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #333;
        }

        textarea.text-input {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 40px;
        }

        .submit-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .color-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .option-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>视频定制</h1>
            <p class="subtitle">KKV 系列 · 脚趾甲特写</p>
        </header>

        <form id="customForm">
            <!-- 第一幕：指甲油颜色选择 -->
            <div class="form-section">
                <h2 class="section-title">第一幕：选择指甲油颜色</h2>
                
                <div class="preview-box">
                    <div class="preview-title">实时预览效果</div>
                    <div class="preview-container">
                        <!-- 真实脚趾照片 -->
                        <img src="https://i.imgur.com/8XqzKQl.jpeg" alt="脚趾甲预览" class="preview-image" id="footImage">
                        
                        <!-- 指甲颜色叠加层 -->
                        <div class="nail-overlay nail-overlay-1" id="overlay1"></div>
                        <div class="nail-overlay nail-overlay-2" id="overlay2"></div>
                        <div class="nail-overlay nail-overlay-3" id="overlay3"></div>
                        <div class="nail-overlay nail-overlay-4" id="overlay4"></div>
                        <div class="nail-overlay nail-overlay-5" id="overlay5"></div>
                    </div>
                </div>

                <div class="color-grid">
                    <div class="color-card selected" data-color="#9B1B30" data-name="KKV 经典">
                        <div class="color-swatch" style="background: #9B1B30;"></div>
                        <div class="color-name">KKV 经典</div>
                    </div>
                    
                    <div class="color-card" data-color="#C41E3A" data-name="酒红">
                        <div class="color-swatch" style="background: #C41E3A;"></div>
                        <div class="color-name">酒红</div>
                    </div>
                    
                    <div class="color-card" data-color="#8B1538" data-name="复古红">
                        <div class="color-swatch" style="background: #8B1538;"></div>
                        <div class="color-name">复古红</div>
                    </div>
                    
                    <div class="color-card" data-color="#DC143C" data-name="胭脂红">
                        <div class="color-swatch" style="background: #DC143C;"></div>
                        <div class="color-name">胭脂红</div>
                    </div>
                    
                    <div class="color-card" data-color="#FF9A8B" data-name="珊瑚粉">
                        <div class="color-swatch" style="background: #FF9A8B;"></div>
                        <div class="color-name">珊瑚粉</div>
                    </div>
                    
                    <div class="color-card" data-color="#FF6B9D" data-name="樱花粉">
                        <div class="color-swatch" style="background: #FF6B9D;"></div>
                        <div class="color-name">樱花粉</div>
                    </div>
                    
                    <div class="color-card" data-color="#4A7C59" data-name="墨绿">
                        <div class="color-swatch" style="background: #4A7C59;"></div>
                        <div class="color-name">墨绿</div>
                    </div>
                    
                    <div class="color-card" data-color="#D4A574" data-name="裸色">
                        <div class="color-swatch" style="background: #D4A574;"></div>
                        <div class="color-name">裸色</div>
                    </div>
                    
                    <div class="color-card" data-color="#B8860B" data-name="香槟金">
                        <div class="color-swatch" style="background: #B8860B;"></div>
                        <div class="color-name">香槟金</div>
                    </div>
                    
                    <div class="color-card" data-color="#8B0000" data-name="深酒红">
                        <div class="color-swatch" style="background: #8B0000;"></div>
                        <div class="color-name">深酒红</div>
                    </div>
                    
                    <div class="color-card" data-color="#A52A2A" data-name="棕红">
                        <div class="color-swatch" style="background: #A52A2A;"></div>
                        <div class="color-name">棕红</div>
                    </div>
                </div>
            </div>

            <!-- 第二幕：视频时长 -->
            <div class="form-section">
                <h2 class="section-title">第二幕：视频时长</h2>
                <div class="option-grid">
                    <label class="option-card">
                        <input type="radio" name="duration" value="15s" required>
                        <div class="option-label">15 秒</div>
                        <div class="option-price">短视频</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="duration" value="30s">
                        <div class="option-label">30 秒</div>
                        <div class="option-price">标准版</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="duration" value="60s">
                        <div class="option-label">60 秒</div>
                        <div class="option-price">完整版</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="duration" value="custom">
                        <div class="option-label">自定义</div>
                        <div class="option-price">Custom</div>
                    </label>
                </div>
            </div>

            <!-- 第三幕：视频风格 -->
            <div class="form-section">
                <h2 class="section-title">第三幕：视频风格</h2>
                <div class="option-grid">
                    <label class="option-card">
                        <input type="radio" name="style" value="minimal" required>
                        <div class="option-label">极简风</div>
                        <div class="option-price">Minimalist</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="style" value="modern">
                        <div class="option-label">现代风</div>
                        <div class="option-price">Modern</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="style" value="cinematic">
                        <div class="option-label">电影感</div>
                        <div class="option-price">Cinematic</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="style" value="creative">
                        <div class="option-label">创意风</div>
                        <div class="option-price">Creative</div>
                    </label>
                </div>
            </div>

            <!-- 第四幕：分辨率 -->
            <div class="form-section">
                <h2 class="section-title">第四幕：输出分辨率</h2>
                <div class="option-grid">
                    <label class="option-card">
                        <input type="radio" name="resolution" value="1080p" required>
                        <div class="option-label">1080P</div>
                        <div class="option-price">Full HD</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="resolution" value="4k">
                        <div class="option-label">4K</div>
                        <div class="option-price">Ultra HD</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="resolution" value="vertical">
                        <div class="option-label">竖屏</div>
                        <div class="option-price">9:16 Social</div>
                    </label>
                </div>
            </div>

            <!-- 第五幕：配乐 -->
            <div class="form-section">
                <h2 class="section-title">第五幕：配乐选择</h2>
                <div class="option-grid">
                    <label class="option-card">
                        <input type="radio" name="music" value="upbeat" required>
                        <div class="option-label">轻快活泼</div>
                        <div class="option-price">Upbeat</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="music" value="calm">
                        <div class="option-label">舒缓优雅</div>
                        <div class="option-price">Calm</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="music" value="epic">
                        <div class="option-label">史诗大气</div>
                        <div class="option-price">Epic</div>
                    </label>
                    <label class="option-card">
                        <input type="radio" name="music" value="none">
                        <div class="option-label">无需配乐</div>
                        <div class="option-price">No Music</div>
                    </label>
                </div>
            </div>

            <!-- 附加服务 -->
            <div class="form-section">
                <h2 class="section-title">附加服务</h2>
                <div class="option-grid">
                    <label class="option-card">
                        <input type="checkbox" name="extras" value="subtitles">
                        <div class="option-label">字幕制作</div>
                        <div class="option-price">Subtitles</div>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="extras" value="color">
                        <div class="option-label">调色优化</div>
                        <div class="option-price">Color Grading</div>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="extras" value="voiceover">
                        <div class="option-label">旁白配音</div>
                        <div class="option-price">Voice Over</div>
                    </label>
                    <label class="option-card">
                        <input type="checkbox" name="extras" value="rush">
                        <div class="option-label">加急交付</div>
                        <div class="option-price">Rush Delivery</div>
                    </label>
                </div>
            </div>

            <!-- 需求描述 -->
            <div class="form-section">
                <h2 class="section-title">需求描述</h2>
                <textarea class="text-input" name="description" placeholder="请详细描述您的视频需求，包括内容要点、特殊要求、参考风格等..."></textarea>
            </div>

            <!-- 联系方式 -->
            <div class="form-section">
                <h2 class="section-title">联系方式</h2>
                <input type="text" class="text-input" name="contact" placeholder="您的姓名 / 微信 / 邮箱" required style="margin-bottom: 15px;">
                <input type="text" class="text-input" name="company" placeholder="公司名称（选填）">
            </div>

            <button type="submit" class="submit-btn">提交需求</button>
        </form>
    </div>

    <script>
        // 颜色选择逻辑
        let selectedColor = '#9B1B30';
        let selectedColorName = 'KKV 经典';

        document.querySelectorAll('.color-card').forEach(card => {
            card.addEventListener('click', function() {
                // 移除其他卡片的选中状态
                document.querySelectorAll('.color-card').forEach(c => c.classList.remove('selected'));
                
                // 添加当前卡片的选中状态
                this.classList.add('selected');
                
                // 获取颜色值
                const color = this.dataset.color;
                const name = this.dataset.name;
                selectedColor = color;
                selectedColorName = name;
                
                // 更新所有指甲颜色
                updateNailColor(color);
            });
        });

        // 更新指甲颜色
        function updateNailColor(color) {
            for (let i = 1; i <= 5; i++) {
                const overlay = document.getElementById(`overlay${i}`);
                if (overlay) {
                    overlay.style.backgroundColor = color;
                }
            }
        }

        // 选项卡选择效果
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const input = this.querySelector('input');
                if (input.type === 'radio') {
                    const name = input.name;
                    document.querySelectorAll(`input[name="${name}"]`).forEach(radio => {
                        radio.closest('.option-card').classList.remove('selected');
                    });
                    this.classList.add('selected');
                } else if (input.type === 'checkbox') {
                    this.classList.toggle('selected');
                }
            });
        });

        // 表单提交
        document.getElementById('customForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.nailColor = selectedColorName;
            
            alert(`感谢提交！\n\n指甲油颜色：${selectedColorName}\n视频时长：${data.duration || '未选择'}\n视频风格：${data.style || '未选择'}\n\n我们会尽快与您联系。`);
        });

        // 初始化颜色
        updateNailColor('#9B1B30');
    </script>
</body>
</html>
