<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脚趾甲颜色定制 | KKV 系列</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        /* 预览区域 */
        .preview-section {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }

        .preview-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 30px;
            color: #333;
        }

        .foot-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .foot-svg {
            width: 100%;
            max-width: 500px;
            height: auto;
        }

        .toenail {
            transition: fill 0.3s ease;
            cursor: pointer;
        }

        .toenail:hover {
            filter: brightness(1.1);
        }

        /* 颜色选择区域 */
        .color-section {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }

        .section-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 15px;
            color: #333;
        }

        .section-subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .color-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-card:hover {
            transform: scale(1.05);
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .color-swatch::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .color-name {
            font-size: 0.9rem;
            color: #333;
            text-align: center;
            font-weight: 400;
        }

        .color-card.selected .color-swatch {
            box-shadow: 0 0 0 4px #333, 0 4px 15px rgba(0,0,0,0.15);
        }

        /* 当前选中颜色显示 */
        .current-color {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
        }

        .current-color-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .current-color-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
        }

        /* 下一步按钮 */
        .next-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 40px auto 0;
            padding: 18px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .preview-section,
            .color-section {
                padding: 25px;
            }

            .color-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }

            .color-swatch {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>脚趾甲颜色定制</h1>
            <p class="subtitle">KKV 指甲油系列 · 第一幕</p>
        </header>

        <!-- 预览区域 -->
        <div class="preview-section">
            <h2 class="preview-title">预览效果</h2>
            <div class="foot-preview">
                <svg class="foot-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <!-- 脚部轮廓 -->
                    <defs>
                        <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#f5d5c5;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#e8c4b0;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    
                    <!-- 脚部形状 -->
                    <ellipse cx="200" cy="180" rx="120" ry="80" fill="url(#skinGradient)" stroke="#d4a995" stroke-width="2"/>
                    
                    <!-- 大脚趾 -->
                    <g class="toe" id="toe1">
                        <ellipse cx="260" cy="170" rx="35" ry="40" fill="url(#skinGradient)" stroke="#d4a995" stroke-width="1.5"/>
                        <ellipse class="toenail" id="nail1" cx="265" cy="165" rx="22" ry="28" fill="#C41E3A"/>
                        <ellipse cx="268" cy="158" rx="8" ry="10" fill="rgba(255,255,255,0.3)"/>
                    </g>
                    
                    <!-- 第二脚趾 -->
                    <g class="toe" id="toe2">
                        <ellipse cx="220" cy="155" rx="28" ry="35" fill="url(#skinGradient)" stroke="#d4a995" stroke-width="1.5"/>
                        <ellipse class="toenail" id="nail2" cx="223" cy="150" rx="18" ry="24" fill="#C41E3A"/>
                        <ellipse cx="226" cy="144" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/>
                    </g>
                    
                    <!-- 第三脚趾 -->
                    <g class="toe" id="toe3">
                        <ellipse cx="185" cy="150" rx="26" ry="32" fill="url(#skinGradient)" stroke="#d4a995" stroke-width="1.5"/>
                        <ellipse class="toenail" id="nail3" cx="187" cy="145" rx="16" ry="22" fill="#C41E3A"/>
                        <ellipse cx="190" cy="140" rx="5" ry="7" fill="rgba(255,255,255,0.3)"/>
                    </g>
                    
                    <!-- 第四脚趾 -->
                    <g class="toe" id="toe4">
                        <ellipse cx="150" cy="152" rx="24" ry="30" fill="url(#skinGradient)" stroke="#d4a995" stroke-width="1.5"/>
                        <ellipse class="toenail" id="nail4" cx="152" cy="147" rx="15" ry="20" fill="#C41E3A"/>
                        <ellipse cx="154" cy="142" rx="5" ry="6" fill="rgba(255,255,255,0.3)"/>
                    </g>
                    
                    <!-- 小脚趾 -->
                    <g class="toe" id="toe5">
                        <ellipse cx="120" cy="160" rx="20" ry="25" fill="url(#skinGradient)" stroke="#d4a995" stroke-width="1.5"/>
                        <ellipse class="toenail" id="nail5" cx="122" cy="155" rx="12" ry="17" fill="#C41E3A"/>
                        <ellipse cx="124" cy="151" rx="4" ry="5" fill="rgba(255,255,255,0.3)"/>
                    </g>
                </svg>
            </div>
        </div>

        <!-- 颜色选择区域 -->
        <div class="color-section">
            <h2 class="section-title">选择你的脚趾甲颜色</h2>
            <p class="section-subtitle">KKV 指甲油系列</p>
            
            <div class="color-grid">
                <div class="color-card" data-color="#FF9A8B" data-name="珊瑚粉">
                    <div class="color-swatch" style="background: #FF9A8B;"></div>
                    <div class="color-name">珊瑚粉</div>
                </div>
                
                <div class="color-card" data-color="#4A7C59" data-name="墨绿">
                    <div class="color-swatch" style="background: #4A7C59;"></div>
                    <div class="color-name">墨绿</div>
                </div>
                
                <div class="color-card" data-color="#C41E3A" data-name="酒红">
                    <div class="color-swatch" style="background: #C41E3A;"></div>
                    <div class="color-name">酒红</div>
                </div>
                
                <div class="color-card" data-color="#8B1538" data-name="复古红">
                    <div class="color-swatch" style="background: #8B1538;"></div>
                    <div class="color-name">复古红</div>
                </div>
                
                <div class="color-card" data-color="#A52A2A" data-name="棕红">
                    <div class="color-swatch" style="background: #A52A2A;"></div>
                    <div class="color-name">棕红</div>
                </div>
                
                <div class="color-card" data-color="#DC143C" data-name="胭脂红">
                    <div class="color-swatch" style="background: #DC143C;"></div>
                    <div class="color-name">胭脂红</div>
                </div>
                
                <div class="color-card" data-color="#6B2C3D" data-name="KKV 经典">
                    <div class="color-swatch" style="background: #6B2C3D;"></div>
                    <div class="color-name">KKV 经典</div>
                </div>
                
                <div class="color-card" data-color="#2D2D2D" data-name="曜石黑">
                    <div class="color-swatch" style="background: #2D2D2D;"></div>
                    <div class="color-name">曜石黑</div>
                </div>
                
                <div class="color-card" data-color="#D4A574" data-name="裸色">
                    <div class="color-swatch" style="background: #D4A574;"></div>
                    <div class="color-name">裸色</div>
                </div>
                
                <div class="color-card" data-color="#FF6B9D" data-name="樱花粉">
                    <div class="color-swatch" style="background: #FF6B9D;"></div>
                    <div class="color-name">樱花粉</div>
                </div>
                
                <div class="color-card" data-color="#8B0000" data-name="深酒红">
                    <div class="color-swatch" style="background: #8B0000;"></div>
                    <div class="color-name">深酒红</div>
                </div>
                
                <div class="color-card" data-color="#B8860B" data-name="香槟金">
                    <div class="color-swatch" style="background: #B8860B;"></div>
                    <div class="color-name">香槟金</div>
                </div>
            </div>

            <div class="current-color">
                <div class="current-color-label">当前选择</div>
                <div class="current-color-value" id="currentColorName">酒红</div>
            </div>

            <button class="next-btn" onclick="nextStep()">下一步</button>
        </div>
    </div>

    <script>
        let selectedColor = '#C41E3A';
        let selectedName = '酒红';

        // 颜色卡片点击事件
        document.querySelectorAll('.color-card').forEach(card => {
            card.addEventListener('click', function() {
                // 移除其他卡片的选中状态
                document.querySelectorAll('.color-card').forEach(c => c.classList.remove('selected'));
                
                // 添加当前卡片的选中状态
                this.classList.add('selected');
                
                // 获取颜色值
                const color = this.dataset.color;
                const name = this.dataset.name;
                selectedColor = color;
                selectedName = name;
                
                // 更新所有脚趾甲颜色
                updateToenailColor(color);
                
                // 更新当前选择显示
                document.getElementById('currentColorName').textContent = name;
            });
        });

        // 更新脚趾甲颜色
        function updateToenailColor(color) {
            for (let i = 1; i <= 5; i++) {
                const nail = document.getElementById(`nail${i}`);
                if (nail) {
                    nail.style.fill = color;
                }
            }
        }

        // 下一步
        function nextStep() {
            alert(`已选择：${selectedName}\n\n接下来可以选择视频风格和其他选项！`);
            // 这里可以跳转到下一步页面
        }

        // 初始化：默认选中酒红
        document.querySelector('[data-color="#C41E3A"]').classList.add('selected');
    </script>
</body>
</html>
